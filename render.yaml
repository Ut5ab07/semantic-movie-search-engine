services:
  - type: web
    name: semantic-movie-search-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: ALLOWED_ORIGINS
        sync: false
